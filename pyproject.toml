[project]
name = "my-py-music-box"
version = "0.1.0"
description = "Desktop music-box emulator (Kivy + SQLite) with a classic 21-tine comb."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "LHES Tech Solutions" },
]
requires-python = ">=3.11"
dependencies = [
  "kivy>=2.3.0",
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://lhes.tech"
Repository = "https://github.com/leonardo-holanda-e-silva/my-py-music-box"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
my-py-music-box = "my_py_music_box.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_py_music_box"]

[tool.hatch.build.targets.wheel.force-include]
"src/my_py_music_box/assets" = "my_py_music_box/assets"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
